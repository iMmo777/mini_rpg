name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version ($expected)."
            exit 1
          fi
      - run: npm test
      - run: npm run mcaddon
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/mini_rpg.mcaddon
          generate_release_notes: true
